# Firebase App Hosting config for the core-api backend.
#
# Lives at the repo root so App Hosting can find package-lock.json and run
# `npm ci` from the workspace root before the framework adapter focuses on
# the app at `apps/core-api/`. This mirrors the apps/web pattern in the
# private monorepo.
#
# The `apps/core-api/apphosting.yaml` in this repo is shadowed by this file
# at deploy time and kept only for documentation parity with the private
# monorepo's source tree.

rootDirectory: apps/core-api

runConfig:
    # min=0 is fine for a solo-user deployment; revisit if we get real traffic.
    minInstances: 0
    # Cloud Run requires startupProbe.timeoutSeconds <= periodSeconds. Total
    # startup window = failureThreshold × periodSeconds = 300s (5 min), which
    # is plenty for Node + Hono + Firebase Admin cold starts.
    startupProbe:
        timeoutSeconds: 10
        periodSeconds: 30
        failureThreshold: 10
    livenessProbe:
        failureThreshold: 10

# Environment + secrets.
#
# Sharing credentials with apps/web for now per specs/decoupling-migration.md
# § Post-4a Follow-ups ("Split service accounts"). When that follow-up lands,
# core-api gets its own secrets with narrower IAM scopes.
#
# Naming convention: no `NEXT_PUBLIC_*` prefix here — that's a Next.js thing;
# core-api is a plain Node service. Variables pull from the same Secret
# Manager entries apps/web uses.
env:
    - variable: FIREBASE_PROJECT_ID
      secret: NEXT_PUBLIC_FIREBASE_PROJECT_ID
      availability:
          - BUILD
          - RUNTIME
    - variable: FIREBASE_STORAGE_BUCKET
      secret: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
      availability:
          - BUILD
          - RUNTIME
    - variable: ADMIN_SERVICE_ACCOUNT_JSON
      secret: ADMIN_SERVICE_ACCOUNT_JSON
      availability:
          - BUILD
          - RUNTIME
    - variable: GCLOUD_PROJECT
      value: "vox-pop-simple"
      availability:
          - RUNTIME
    - variable: NODE_ENV
      value: "production"
      availability:
          - RUNTIME
    - variable: LOG_LEVEL
      value: "info"
      availability:
          - RUNTIME
    # CORS allowlist for browser-direct calls. Comma-separated full origins
    # (with scheme). Mirrors apps/core-api/apphosting.yaml in the private
    # monorepo, which is shadowed by this file at deploy time. See
    # apps/core-api/src/app.ts:parseAllowedOrigins for the parser.
    - variable: ALLOWED_ORIGINS
      value: "https://voxpop.phonicfactory.com,https://vox-pop--vox-pop-simple.us-east4.hosted.app,https://vox-pop-core-api--vox-pop-simple.us-east4.hosted.app,http://localhost:9002"
      availability:
          - RUNTIME
    # Shared secret for sibling-service auth — apps/web (and eventually
    # apps/telephony) authenticate to /api/v1/system/* with this. Verified
    # by apps/core-api/src/middleware/system-auth.ts. Mirrors the binding
    # in apps/core-api/apphosting.yaml on the private monorepo. Must stay
    # in sync there — this root file shadows the apps/core-api one at
    # deploy time, so additions/changes to the secret config need to land
    # here, not just there.
    - variable: SYSTEM_AUTH_TOKEN
      secret: SYSTEM_AUTH_TOKEN
      availability:
          - RUNTIME
