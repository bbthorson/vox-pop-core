name: Deploy Docs

# Keeps https://vox-pop-docs.web.app in sync with the source. The docs
# (Astro Starlight) live only in this public mirror under `docs/` and are
# NOT a synced subtree, so they are authored and deployed from here.
#
# Before this workflow, docs only updated on a manual `npm run deploy`, so
# the live site could drift behind `docs/`. This deploys on every push to
# master that touches the docs (or the API surface the reference embeds).
#
# Path-filtered like deploy-rules.yml so unrelated pushes don't redeploy.
# Note `apps/core-api/openapi.json` is included: `docs/scripts/copy-openapi.mjs`
# copies it into the Scalar API reference at build time, so a surface change
# should refresh the published reference too.
#
# One-time setup: this repo needs the FIREBASE_SERVICE_ACCOUNT_VOX_POP_SIMPLE
# secret (a service account JSON with Firebase Hosting deploy permission on
# the vox-pop-simple project) — the same secret the private repo's
# deploy-rules.yml uses.

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'apps/core-api/openapi.json'
      - '.github/workflows/deploy-docs.yml'

jobs:
  deploy_docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json

      - name: Build docs
        working-directory: docs
        run: |
          npm ci
          npm run build

      - name: Install Firebase Tools
        run: npm install -g firebase-tools

      - name: Deploy Docs
        run: firebase deploy --only hosting:docs --project vox-pop-simple
        env:
          FIREBASE_SERVICE_ACCOUNT_VOX_POP_SIMPLE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VOX_POP_SIMPLE }}
