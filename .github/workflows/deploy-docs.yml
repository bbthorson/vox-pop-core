name: Deploy docs
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-docs.yml'

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json
      - name: Install docs deps
        working-directory: docs
        run: npm ci
      - name: Build docs
        working-directory: docs
        run: npm run build
      - name: Deploy to Firebase Hosting (preview on PR, live on push)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VOX_POP_SIMPLE }}
          channelId: ${{ github.event_name == 'push' && 'live' || '' }}
          projectId: vox-pop-simple
          target: docs
